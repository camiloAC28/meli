<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meli Meli</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: sidebar + content on desktop, scrolling tab strip on phones.
   Money first: large figures, quiet chrome. Green = income, blue = expense/structure, amber and red only for alerts. */
:root{
  --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Sora','Manrope',system-ui,sans-serif;
  --bg:#F3F7F5; --surface:#FFFFFF; --surface2:#EAF1EE; --fg:#0F211B; --muted:#53695F; --line:#D5E1DC;
  --green:#0B7A55; --green-soft:#DDF3E9; --blue:#2757D9; --blue-soft:#E3EAFB;
  --warn:#8F5A00; --warn-soft:#FCEFD2; --bad:#B8352E; --bad-soft:#FBE2DF; --on-accent:#FFFFFF;
  --c1:#0B7A55; --c2:#2757D9; --c3:#C27C0E; --c4:#8A4FD6; --c5:#D1495B; --c6:#0E9AA7; --c7:#6B8E23; --c8:#7A8794;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1612; --surface:#12211C; --surface2:#1A2C26; --fg:#E5F0EB; --muted:#94AAA1; --line:#26403A;
    --green:#34D399; --green-soft:#12362A; --blue:#8AAEFF; --blue-soft:#17264F;
    --warn:#F0BE5A; --warn-soft:#3A2D10; --bad:#F28B82; --bad-soft:#40201D; --on-accent:#05140E;
    --c1:#34D399; --c2:#8AAEFF; --c3:#F0BE5A; --c4:#B794F4; --c5:#F28B9B; --c6:#4FD1DB; --c7:#A3C95A; --c8:#9AA7B3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1612; --surface:#12211C; --surface2:#1A2C26; --fg:#E5F0EB; --muted:#94AAA1; --line:#26403A;
  --green:#34D399; --green-soft:#12362A; --blue:#8AAEFF; --blue-soft:#17264F;
  --warn:#F0BE5A; --warn-soft:#3A2D10; --bad:#F28B82; --bad-soft:#40201D; --on-accent:#05140E;
  --c1:#34D399; --c2:#8AAEFF; --c3:#F0BE5A; --c4:#B794F4; --c5:#F28B9B; --c6:#4FD1DB; --c7:#A3C95A; --c8:#9AA7B3;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:600}
h2{font-size:1.1rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{max-width:1180px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.25rem}
.brand svg{width:34px;height:34px;flex:none}
.who{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);min-width:0}
.who img{width:28px;height:28px;border-radius:50%;flex:none}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
nav.tabs a{flex:none;padding:8px 14px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.88rem;border:1px solid transparent}
nav.tabs a:hover{background:var(--surface2)}
nav.tabs a[aria-current="page"]{background:var(--green);color:var(--on-accent)}
main{min-width:0;display:grid;gap:16px;align-content:start}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
@media (min-width:960px){
  .app{grid-template-columns:200px minmax(0,1fr);grid-template-areas:"top top" "nav main";gap:20px 28px}
  .top{grid-area:top}
  nav.tabs{grid-area:nav;flex-direction:column;overflow:visible;align-self:start;position:sticky;top:16px}
  nav.tabs a{border-radius:10px}
  main{grid-area:main}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card>header,.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi.hero{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.kpi.hero .kl,.kpi.hero .ks{color:inherit;opacity:.85}
.kl{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kv{font-family:var(--font-display);font-size:1.45rem;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ks{font-size:.8rem;color:var(--muted)}
.pos{color:var(--green)} .neg{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:10px;font-weight:600;font-size:.88rem;cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn[disabled]{opacity:.55;cursor:default}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.mnav{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.mnav button{border:0;background:transparent;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1.1rem;color:var(--fg)}
.mnav button:hover{background:var(--surface2)}
.mnav strong{min-width:120px;text-align:center;text-transform:capitalize;font-size:.9rem}
.list{display:grid;gap:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row .l{min-width:0;flex:1 1 200px}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .m{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.row .r{display:flex;align-items:center;gap:10px;margin-left:auto}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--green)}
.bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)} .bar.blue>i{background:var(--blue)}
.brow{display:grid;gap:5px;padding:9px 0}
.brow .h{display:flex;justify-content:space-between;gap:10px;font-size:.88rem}
.brow .h span:first-child{overflow-wrap:anywhere}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:.88rem;background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.info{background:var(--blue-soft);color:var(--blue)}
.alert b{font-weight:700}
.alert a{color:inherit;font-weight:700}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:.9rem}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
svg.chart .gl{stroke:var(--line);stroke-width:1}
svg.chart .vl{fill:var(--fg);font-weight:700}
.bI{fill:var(--green)} .bE{fill:var(--blue)}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.r,th.r{text-align:right}
tfoot td{font-weight:700;border-bottom:0}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;font-size:.84rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.filters{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));margin-bottom:12px}
.f{display:grid;gap:4px;min-width:0}
.f label{font-size:.78rem;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea,.filters input,.filters select{width:100%;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:16px}
.f .hint{font-size:.76rem;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(5,15,11,.55)}
.sheet{position:relative;background:var(--surface);color:var(--fg);width:min(520px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
@media (min-width:640px){#modal{align-items:center}.sheet{border-radius:18px}}
.sheet header{display:flex;justify-content:space-between;align-items:center}
.sheet .x{border:0;background:transparent;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--muted)}
.sheet footer{display:flex;gap:8px;align-items:center;margin-top:4px}
.sp{flex:1}
.err{color:var(--bad);font-size:.85rem;font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;font-weight:600;z-index:60;max-width:90vw}
#toast[hidden]{display:none}
.chat{display:grid;gap:12px}
.msgs{display:grid;gap:10px;max-height:56vh;overflow-y:auto;padding:4px 2px}
.bub{max-width:88%;padding:10px 14px;border-radius:14px;font-size:.92rem;overflow-wrap:anywhere}
.bub.me{justify-self:end;background:var(--blue);color:var(--on-accent);border-bottom-right-radius:4px}
.bub.bot{justify-self:start;background:var(--surface2);border-bottom-left-radius:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.82rem;cursor:pointer;font-weight:600}
.chip:hover{background:var(--surface2)}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
.notice{padding:18px;border-radius:14px;background:var(--blue-soft);color:var(--fg);display:grid;gap:8px}
.notice h2{color:var(--blue)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
<style>html{color-scheme:light}body{margin:0}</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="var(--green)"/><rect x="9" y="21" width="5" height="10" rx="2" fill="var(--on-accent)"/><rect x="17.5" y="15" width="5" height="16" rx="2" fill="var(--on-accent)"/><rect x="26" y="9" width="5" height="22" rx="2" fill="var(--on-accent)"/></svg>
      <span>Meli Meli</span>
    </div>
    <div class="who" id="who"></div>
  </header>
  <nav class="tabs" id="nav" aria-label="Secciones"></nav>
  <main id="main"><div class="empty">Cargando Meli Meli…</div></main>
</div>
<div id="modal" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
/*LOGIC*/
const CATS_G=['Alimentación','Transporte','Vivienda y arriendo','Servicios públicos','Educación','Salud','Entretenimiento','Compras personales','Deudas y préstamos','Suscripciones','Otros gastos'];
const CATS_I=['Salario','Negocio o emprendimiento','Ventas','Servicios prestados','Ingresos adicionales','Otros ingresos'];
const METODOS={efectivo:'Efectivo',transferencia:'Transferencia',debito:'Tarjeta débito',credito:'Tarjeta crédito',otro:'Otro'};
const TIPOS_CUENTA={efectivo:'Efectivo',banco:'Cuenta bancaria',tarjeta:'Tarjeta',digital:'Billetera digital',otro:'Otra'};
const MONEDAS=['COP','USD','EUR','MXN','PEN','CLP','ARS','BRL','GBP'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const S={uid:null,name:'',avatar:'',root:null,db:null,sample:null,dl:null,state:'loading',readonly:false,
  tx:[],acc:[],cat:[],bud:[],goal:[],debt:[],rec:[],pay:[],cfg:{currency:'COP'},loaded:{},
  view:'resumen',month:'',year:'',rtab:'hist',f:{from:'',to:'',type:'',cat:'',q:''},chat:[],chatMounted:false,busy:false,ctl:null,slow:false,local:false};

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ymd(new Date());
const monthKey=d=>ymd(d).slice(0,7);
function addMonths(k,n){const [y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function monthLabel(k){const [y,m]=k.split('-');return MESES[+m-1]+' '+y}
function daysIn(k){const [y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function parseMoney(s){
  s=String(s==null?'':s).trim().replace(/[^\d.,-]/g,'');
  if(!s) return NaN;
  const neg=s.startsWith('-'); s=s.replace(/-/g,'');
  if(!s) return NaN;
  const ld=s.lastIndexOf('.'), lc=s.lastIndexOf(',');
  let out;
  if(ld>-1&&lc>-1){
    const dec=ld>lc?'.':',', th=dec==='.'?',':'.';
    out=s.split(th).join('').replace(dec,'.');
  }else if(ld>-1||lc>-1){
    const sep=ld>-1?'.':',', parts=s.split(sep);
    if(parts.length>2) out=parts.join('');
    else if(parts[1].length===3&&parts[0]!==''&&parts[0]!=='0') out=parts.join('');
    else out=parts[0]+'.'+parts[1];
  }else out=s;
  const n=parseFloat(out);
  return isNaN(n)?NaN:(neg?-n:n);
}
function fmtMoney(n,cur){
  cur=cur||'COP'; const d=(cur==='COP'||cur==='CLP')?0:2;
  try{return new Intl.NumberFormat('es-CO',{style:'currency',currency:cur,minimumFractionDigits:d,maximumFractionDigits:d}).format(n||0)}
  catch(e){return String(Math.round(n||0))}
}
const money=n=>fmtMoney(n,S.cfg.currency);
function compact(n){
  const a=Math.abs(n), s=n<0?'-':'';
  if(a>=1e6) return s+(a/1e6).toFixed(1).replace('.',',').replace(',0','')+' M';
  if(a>=1e3) return s+Math.round(a/1e3)+' mil';
  return s+Math.round(a);
}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}

const sumType=(list,type)=>list.filter(t=>t.type===type).reduce((a,t)=>a+t.amount,0);
const inMonth=(t,k)=>t.date.slice(0,7)===k;
function monthTotals(tx,k){const l=tx.filter(t=>inMonth(t,k));return{inc:sumType(l,'ingreso'),exp:sumType(l,'gasto')}}
function byCat(list,type){const m={};list.filter(t=>t.type===type).forEach(t=>{m[t.cat]=(m[t.cat]||0)+t.amount});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function totalBalance(tx,acc){return acc.reduce((a,x)=>a+(x.initial||0),0)+sumType(tx,'ingreso')-sumType(tx,'gasto')}
function accBalance(a,tx){return (a.initial||0)+tx.filter(t=>t.acc===a.id).reduce((s,t)=>s+(t.type==='ingreso'?t.amount:-t.amount),0)}
function lastMonths(endKey,n){const out=[];for(let i=n-1;i>=0;i--)out.push(addMonths(endKey,-i));return out}
function balanceAt(k,tx,acc){
  let b=acc.reduce((a,x)=>a+(x.initial||0),0);
  tx.forEach(t=>{if(t.date.slice(0,7)<=k)b+=t.type==='ingreso'?t.amount:-t.amount});return b;
}
function budgetRows(tx,bud,k){
  const spent={};tx.filter(t=>inMonth(t,k)&&t.type==='gasto').forEach(t=>{spent[t.cat]=(spent[t.cat]||0)+t.amount});
  return bud.filter(b=>b.cat!=='_total').map(b=>({id:b.id,cat:b.cat,limit:b.limit,spent:spent[b.cat]||0,pct:b.limit>0?(spent[b.cat]||0)/b.limit:0}))
    .sort((a,b)=>b.pct-a.pct);
}
function filterTx(tx,f){
  const q=(f.q||'').toLowerCase().trim();
  return tx.filter(t=>(!f.from||t.date>=f.from)&&(!f.to||t.date<=f.to)&&(!f.type||t.type===f.type)&&(!f.cat||t.cat===f.cat)
    &&(!q||(t.desc||'').toLowerCase().includes(q)||(t.cat||'').toLowerCase().includes(q)));
}
function sortTx(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.createdAt||0)-(a.createdAt||0)}
/*END*/

const $=s=>document.querySelector(s);
const accName=id=>{const a=S.acc.find(x=>x.id===id);return a?a.name:'Sin cuenta'};
const catList=type=>{const base=type==='ingreso'?CATS_I:CATS_G;const extra=S.cat.filter(c=>c.type===type).map(c=>c.name).filter(n=>!base.includes(n)).sort((a,b)=>a.localeCompare(b,'es'));return base.concat(extra)};
const catColor=(name,type)=>{const all=catList(type||'gasto');const i=all.indexOf(name);return 'var(--c'+(((i<0?0:i)%8)+1)+')'};
const nowKey=()=>monthKey(new Date());
S.month=nowKey(); S.year=String(new Date().getFullYear());

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},3200)}

/* ---------- data layer ---------- */
const COLS=['tx','acc','cat','bud','goal','debt','rec','pay'];
function colRef(n){return S.root.collection(n)}
const NUMF=['amount','limit','target','saved','total','paid','monthly','initial','rate','day'];
function normDoc(id,v){const o=Object.assign({id},v||{});NUMF.forEach(k=>{if(k in o)o[k]=Number(o[k])||0});return o}

/* Modo sin cuenta: los datos viven en este navegador (localStorage). */
const LS_KEY='melimeli:v1';
const Local={
  d:{},
  load(){try{const j=JSON.parse(localStorage.getItem(LS_KEY));this.d=j&&typeof j==='object'&&!Array.isArray(j)?j:{}}catch(e){this.d={}}},
  persist(){try{localStorage.setItem(LS_KEY,JSON.stringify(this.d))}catch(e){throw {code:'storage'}}},
  newId(){return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)},
  set(col,id,data){id=id||this.newId();(this.d[col]=this.d[col]||{})[id]=data;this.persist();refreshLocal()},
  upd(col,id,patch){const cur=(this.d[col]||{})[id];if(!cur)throw {code:'not_found'};this.d[col][id]=Object.assign({},cur,patch);this.persist();refreshLocal()},
  del(col,id){if(this.d[col]){delete this.d[col][id];this.persist();refreshLocal()}}
};
function refreshLocal(){
  COLS.forEach(n=>{S[n]=Object.entries(Local.d[n]||{}).map(([id,v])=>normDoc(id,v))});
  S.tx.sort(sortTx);
  S.cfg=Object.assign({currency:'COP'},(Local.d.cfg||{}).main||{});
  schedule();
}
function restoreLocal(file){
  const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result);if(!j||typeof j!=='object'||Array.isArray(j))throw 0;
    const d={};COLS.concat(['cfg']).forEach(n=>{if(j[n]&&typeof j[n]==='object'&&!Array.isArray(j[n]))d[n]=j[n]});
    Local.d=d;Local.persist();refreshLocal();toast('Copia restaurada');
  }catch(e){toast('El archivo no es una copia válida de Meli Meli.')}};
  r.readAsText(file);
}
async function dbSet(col,id,data){if(S.local)return Local.set(col,id,data);const ref=id?colRef(col).doc(id):colRef(col).doc();await ref.set(data)}
async function dbUpd(col,id,patch){if(S.local)return Local.upd(col,id,patch);await colRef(col).doc(id).update(patch)}
async function dbDel(col,id){if(S.local)return Local.del(col,id);await colRef(col).doc(id).delete()}

async function safe(fn){
  try{await fn();return true}
  catch(e){
    const c=e&&e.code;
    if(c==='invalid_argument'){S.readonly=true;render()}
    toast(c==='quota_exceeded'?'Se alcanzó el límite de datos. Elimina movimientos antiguos.':c==='storage'?'No se pudo guardar en este navegador (modo privado o sin espacio).':'No se pudo guardar. Revisa tu acceso e inténtalo otra vez.');
    return false;
  }
}
async function putDoc(col,id,data){return safe(()=>dbSet(col,id,data))}
async function delDoc(col,id){return safe(()=>dbDel(col,id))}
const updDoc=(col,id,patch)=>safe(()=>dbUpd(col,id,patch));

function startData(){
  const timer=setTimeout(()=>{if(S.state==='loading'){S.state='ready';S.slow=true;render()}},10000);
  const check=()=>{if(S.state==='loading'&&Object.keys(S.loaded).length>=COLS.length+1){clearTimeout(timer);S.state='ready';S.slow=false}};
  COLS.forEach(n=>{
    colRef(n).onSnapshot(snap=>{
      S[n]=snap.docs.map(d=>normDoc(d.id,d.data()));
      if(n==='tx')S.tx.sort(sortTx);
      S.loaded[n]=1;check();schedule();
    },err=>{S.loaded[n]=1;check();if(err&&err.code==='revoked'){S.state='nodb'}schedule()});
  });
  colRef('cfg').doc('main').onSnapshot(s=>{
    const d=s.exists?s.data():null;S.cfg=Object.assign({currency:'COP'},d||{});S.loaded.cfg=1;check();schedule();
  },()=>{S.loaded.cfg=1;check();schedule()});
}

function openModal(title,body,onSubmit,opts){
  opts=opts||{};
  const m=$('#modal');
  m.innerHTML=`<div class="scrim" data-close></div><form class="sheet" id="mform" novalidate><header><h2>${esc(title)}</h2><button type="button" class="x" data-close aria-label="Cerrar">×</button></header>${body}<p class="err" id="merr" hidden></p><footer>${opts.del?'<button type="button" class="btn danger" id="mdel">Eliminar</button>':''}<span class="sp"></span><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn primary" type="submit" id="msave">${esc(opts.save||'Guardar')}</button></footer></form>`;
  m.hidden=false;
  const form=$('#mform'),err=$('#merr'),save=$('#msave');
  const first=form.querySelector('input:not([type=hidden]),select');if(first&&!opts.noFocus)first.focus();
  form.addEventListener('submit',async ev=>{
    ev.preventDefault();err.hidden=true;save.disabled=true;
    let msg;try{msg=await onSubmit(new FormData(form))}catch(e){msg='No se pudo guardar.'}
    save.disabled=false;

    if(del.dataset.sure!=='1'){del.dataset.sure='1';del.textContent='Confirmar eliminación';return}

  });
  return form;
}

/* ---------- charts ---------- */
function barsChart(months){
  const W=420,H=210,pl=46,pr=8,pt=12,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  const data=months.map(k=>Object.assign({k},monthTotals(S.tx,k)));
  const max=niceMax(Math.max(...data.map(d=>Math.max(d.inc,d.exp)),1));
  const y=v=>pt+ih*(1-v/max),gw=iw/data.length,bw=Math.min(18,gw*.3);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos de los últimos meses">`;
  [0,.5,1].forEach(f=>{const v=max*f;s+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${compact(v)}</text>`});
  data.forEach((d,i)=>{
    const cx=pl+gw*i+gw/2,hi=Math.max(d.inc?1:0,ih*d.inc/max),he=Math.max(d.exp?1:0,ih*d.exp/max);
    s+=`<rect class="bI" x="${cx-bw-1.5}" y="${pt+ih-hi}" width="${bw}" height="${hi}" rx="3"><title>${esc(monthLabel(d.k))}: ingresos ${esc(money(d.inc))}</title></rect>`;
    s+=`<rect class="bE" x="${cx+1.5}" y="${pt+ih-he}" width="${bw}" height="${he}" rx="3"><title>${esc(monthLabel(d.k))}: gastos ${esc(money(d.exp))}</title></rect>`;
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${MESES3[+d.k.slice(5)-1]}</text>`;
  });
  return s+'</svg>';
}
function lineChart(months){
  const W=420,H=210,pl=46,pr=22,pt=16,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  const vals=months.map(k=>balanceAt(k,S.tx,S.acc));
  let lo=Math.min(0,...vals),hi=Math.max(0,...vals);if(hi===lo)hi=lo+1;
  const y=v=>pt+ih*(1-(v-lo)/(hi-lo)),x=i=>pl+(months.length===1?iw/2:iw*i/(months.length-1));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del dinero durante los últimos meses">`;
  [lo,(lo+hi)/2,hi].forEach(v=>{s+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${compact(v)}</text>`});
  const pts=vals.map((v,i)=>x(i)+','+y(v)).join(' ');
  s+=`<polygon points="${x(0)},${y(lo)} ${pts} ${x(vals.length-1)},${y(lo)}" fill="var(--green)" opacity=".13"/>`;
  s+=`<polyline points="${pts}" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  vals.forEach((v,i)=>{s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===vals.length-1?5:3}" fill="var(--green)"><title>${esc(monthLabel(months[i]))}: ${esc(money(v))}</title></circle>`;
    s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${MESES3[+months[i].slice(5)-1]}</text>`});
  const last=vals.length-1;
  s+=`<text class="vl" x="${x(last)}" y="${Math.max(11,y(vals[last])-9)}" text-anchor="end">${compact(vals[last])}</text>`;
  return s+'</svg>';
}

  const out=[],k=nowKey(),td=todayStr();
  budgetRows(S.tx,S.bud,k).forEach(b=>{

    else if(b.pct>=.8)out.push(`<div class="alert"><span><b>${esc(b.cat)}:</b> llevas el ${Math.round(b.pct*100)}% de tu límite (${money(b.spent)} de ${money(b.limit)}).</span></div>`);
  });
  const tb=S.bud.find(b=>b.cat==='_total');
  if(tb){const sp=monthTotals(S.tx,k).exp,p=sp/tb.limit;
    if(p>=1)out.push(`<div class="alert bad"><span><b>Presupuesto total:</b> ya gastaste ${money(sp)} y tu límite es ${money(tb.limit)}.</span></div>`);
    else if(p>=.8)out.push(`<div class="alert"><span><b>Presupuesto total:</b> llevas el ${Math.round(p*100)}% de ${money(tb.limit)}.</span></div>`)}
  S.pay.slice().sort((a,b)=>a.due<b.due?-1:1).forEach(p=>{
    const days=Math.round((new Date(p.due+'T00:00')-new Date(td+'T00:00'))/864e5);
    if(days<0)out.push(`<div class="alert bad"><span><b>Pago vencido:</b> ${esc(p.desc)} (${money(p.amount)}) venció el ${esc(p.due)}.</span></div>`);
    else if(days<=7)out.push(`<div class="alert"><span><b>Por vencer:</b> ${esc(p.desc)} (${money(p.amount)}) vence ${days===0?'hoy':'en '+days+' día'+(days===1?'':'s')}.</span></div>`);

  return out.length?`<div class="alerts">${out.join('')}</div>`:'';

function snapshot(){
  const k=nowKey(),t=monthTotals(S.tx,k),ml=S.tx.filter(x=>inMonth(x,k)),prev=lastMonths(k,4).slice(0,3);
  const prevTot=prev.map(m=>Object.assign({mes:monthLabel(m)},monthTotals(S.tx,m)));
  const avg=prevTot.length?prevTot.reduce((a,x)=>a+x.exp,0)/prevTot.length:0;
  const tb=S.bud.find(b=>b.cat==='_total'),r0=n=>Math.round(n);
  return {moneda:S.cfg.currency,mes_actual:monthLabel(k),dia_del_mes:new Date().getDate(),dias_del_mes:daysIn(k),
    dinero_disponible_total:r0(totalBalance(S.tx,S.acc)),
    cuentas:S.acc.map(a=>({nombre:a.name,saldo:r0(accBalance(a,S.tx))})),
    ingresos_mes:r0(t.inc),gastos_mes:r0(t.exp),balance_mes:r0(t.inc-t.exp),
    gastos_mes_por_categoria:byCat(ml,'gasto').map(([c,v])=>({categoria:c,valor:r0(v),porcentaje:t.exp?Math.round(v/t.exp*100):0})),
    ingresos_mes_por_categoria:byCat(ml,'ingreso').map(([c,v])=>({categoria:c,valor:r0(v)})),
    ultimos_3_meses:prevTot.map(x=>({mes:x.mes,ingresos:r0(x.inc),gastos:r0(x.exp)})),promedio_gasto_3_meses:r0(avg),
    presupuesto_total_mensual:tb?r0(tb.limit):null,
    limites_por_categoria:budgetRows(S.tx,S.bud,k).map(b=>({categoria:b.cat,limite:r0(b.limit),gastado:r0(b.spent),porcentaje:Math.round(b.pct*100)})),
    metas_de_ahorro:S.goal.map(g=>({meta:g.name,ahorrado:r0(g.saved),objetivo:r0(g.target),fecha:g.deadline||null})),

function localAnswer(q){

  if(!S.tx.length&&!S.acc.length)return 'Todavía no tengo movimientos tuyos. Crea una cuenta y registra tus primeros ingresos y gastos, y con eso te puedo responder.';
  if(/(puedo|permit|alcanza).*(compr|gast|pag)|compr/.test(n)){
    const m=q.match(/\d[\d.,]*/);const price=m?parseMoney(m[0]):NaN;
    if(!(price>0))return 'Dime el valor de la compra (por ejemplo: «¿puedo comprar algo de 800.000?») y lo comparo con tu dinero disponible y tu presupuesto.';
    const tb=S.bud.find(b=>b.cat==='_total'),left=tb?tb.limit-t.exp:null;
    let a=`Tienes ${money(bal)} disponibles. `;
    if(price>bal)return a+`La compra de ${money(price)} supera lo que tienes hoy; mejor esperar o ahorrar para ella.`;
    if(left!=null&&price>left)return a+`Alcanza, pero te pasarías de tu presupuesto del mes (te quedan ${money(Math.max(0,left))}). Piénsalo bien o muévela al próximo mes.`;
    const after=bal-price,dp=S.debt.reduce((s,d)=>s+d.monthly,0)+S.pay.reduce((s,p)=>s+p.amount,0);
    if(after<dp)return a+`Alcanza, pero después te quedarían ${money(after)} y tienes cerca de ${money(dp)} entre cuotas y pagos pendientes. Con cuidado.`;
    return a+`Después de comprar te quedarían ${money(after)}. Se ve viable${left!=null?' y entra en tu presupuesto':''}.`;
  }
  if(/mayor|mas gasto|categoria|donde gasto/.test(n)){
    const c=byCat(ml,'gasto').slice(0,3);if(!c.length)return 'Este mes aún no hay gastos registrados.';
    return 'Tus mayores gastos de este mes:\n'+c.map(([x,v])=>`- ${x}: ${money(v)} (${t.exp?Math.round(v/t.exp*100):0}%)`).join('\n');
  }
  if(/ahorr/.test(n)){const s=S.goal.reduce((a,g)=>a+g.saved,0);return S.goal.length?`Llevas ${money(s)} ahorrados en ${S.goal.length} meta${S.goal.length===1?'':'s'}:\n`+S.goal.map(g=>`- ${g.name}: ${money(g.saved)} de ${money(g.target)}`).join('\n'):'Aún no tienes metas de ahorro. Crea una en Presupuestos y metas.'}
  if(/disponible|cuanto tengo|saldo/.test(n))return `Tu dinero disponible es ${money(bal)}.`;
  if(/gast/.test(n))return `Este mes llevas ${money(t.exp)} en gastos y ${money(t.inc)} en ingresos. Tu balance del mes es ${money(t.inc-t.exp)}.`;
  if(/organiz|consej|recomend|mejor/.test(n)){
    const tips=['Registra cada gasto el mismo día.','Define un límite para tu categoría más grande.'];
    if(t.inc>0&&t.exp>.8*t.inc)tips.unshift('Este mes gastas más del 80% de lo que ingresas: busca un gasto para recortar.');
    if(!S.goal.length)tips.push('Crea una meta de ahorro y aporta apenas recibas tu ingreso.');
    return 'Algunas ideas para ordenar tu dinero:\n'+tips.map(x=>'- '+x).join('\n');
  }
  return 'Puedo contarte cuánto gastaste este mes, tus mayores gastos, tu dinero disponible, cuánto has ahorrado o si puedes hacer una compra.';
}

  if(!S.sample){finish(localAnswer(text));return}
  const RULES='Eres Meli, la asistente de finanzas personales de la app Meli Meli. Habla en español colombiano neutro, con tono amable, claro y sencillo (frases cortas). Responde SOLO con los datos del usuario que aparecen abajo en JSON; si falta un dato, dilo y sugiere registrarlo en la app. No inventes cifras. Escribe los montos con separador de miles y la moneda indicada. Para «¿puedo comprar X?» compara el precio con el dinero disponible, lo que queda del presupuesto del mes, deudas, pagos pendientes próximos y metas, y da una respuesta clara (sí / con cuidado / mejor esperar) con su razón. Cuando aplique, cierra con un consejo práctico. No eres asesora financiera profesional ni recomiendas inversiones. Máximo 140 palabras. Texto simple; puedes usar viñetas con "- " y **negrita** para cifras clave.\n\nDATOS DEL USUARIO (hoy es '+todayStr()+'):\n'+JSON.stringify(snapshot());

    finish(r.text);

    if(c==='cancelled'){finish(e.text||'Listo, detuve la respuesta.');return}

document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.f==='q'){S.f.q=t.value;updateHist()}});
document.addEventListener('submit',e=>{
  if(e.target.id==='askform'){e.preventDefault();const i=$('#askin');const v=i.value;i.value='';ask(v)}
});
document.addEventListener('click',e=>{if(e.target.id==='askstop'&&S.ctl)S.ctl.abort()});
window.addEventListener('hashchange',route);

(async function init(){
  route();
  const C=window.claude;
  let user=null,db=null;
  if(!(C&&C.use)){
    /* Fuera de Claude (hosting propio): las descargas usan el navegador directamente. */
    S.dl={save:async({filename,data})=>{
      const blob=data instanceof Blob?data:new Blob([data]);
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return {status:'saved'};
    }};
  }
  if(C&&C.use){
    const get=async n=>{try{return await C.use(n)}catch(e){return null}};
    [user,db,S.sample,S.dl]=await Promise.all([get('user'),get('db'),get('sample'),get('downloads')]);
  }
  let me=null;try{me=user?await user.me():null}catch(e){}
  if(me){S.uid=me.id;S.name=me.name||'';S.avatar=me.avatarUrl||''}
  /* Base de datos de la cuenta solo si esta persona puede escribir en ella; si no, modo sin cuenta. */
  let cloud=false;
  if(db&&S.uid&&user){try{cloud=(await user.isOwner())||(await user.canEdit())||((await user.can('data.write'))===true)}catch(e){}}
  if(cloud){S.local=false;S.root=db.doc('data/users/'+S.uid+'/p');render();startData()}
  else{S.local=true;Local.load();S.state='ready';refreshLocal();render()}
})();
</script>

</body>
</html>
